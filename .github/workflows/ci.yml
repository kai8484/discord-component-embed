name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring
          coverage: none

      - name: Lint PHP
        run: find src tests i18n -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JSON
        run: |
          for f in extension.json composer.json i18n/*.json; do
            php -r 'json_decode( file_get_contents( $argv[1] ), false, 512, JSON_THROW_ON_ERROR );' "$f" || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit suite
        run: composer test
